<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#1e293b" />
  <text x="600" y="48" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">Airbnb Production Vacation-Rental Platform — Scaling Architecture</text>
  
  <!-- Outer Containers / Layers -->
  <!-- Layer 1: Client & Edge CDN -->
  <rect x="40" y="110" width="1120" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" />
  <text x="60" y="135" fill="#38bdf8" font-size="14" font-weight="bold">1. CLIENT &amp; GLOBAL EDGE CDN LAYER</text>

  <rect x="80" y="150" width="220" height="50" rx="8" fill="#0284c7" />
  <text x="190" y="180" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Desktop Web (Next.js 14)</text>

  <rect x="340" y="150" width="220" height="50" rx="8" fill="#0284c7" />
  <text x="450" y="180" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Mobile Web &amp; Apps</text>

  <rect x="600" y="150" width="240" height="50" rx="8" fill="#0369a1" />
  <text x="720" y="180" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Vercel Edge / CloudFront CDN</text>

  <rect x="870" y="150" width="250" height="50" rx="8" fill="#0369a1" />
  <text x="995" y="180" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Static Asset Cache (S3 CDN)</text>

  <!-- Layer 2: API Gateway & Load Balancing -->
  <rect x="40" y="250" width="1120" height="100" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" />
  <text x="60" y="275" fill="#f59e0b" font-size="14" font-weight="bold">2. API GATEWAY &amp; LOAD BALANCING LAYER</text>

  <rect x="250" y="290" width="320" height="45" rx="8" fill="#d97706" />
  <text x="410" y="318" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Nginx / Kong API Gateway</text>

  <rect x="630" y="290" width="320" height="45" rx="8" fill="#d97706" />
  <text x="790" y="318" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Rate Limiting &amp; Auth Middleware</text>

  <!-- Layer 3: Microservices Backend -->
  <rect x="40" y="380" width="1120" height="160" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" stroke-dasharray="6,6" />
  <text x="60" y="405" fill="#10b981" font-size="14" font-weight="bold">3. BACKEND MICROSERVICES LAYER (Next.js / Node.js Cluster)</text>

  <rect x="80" y="430" width="230" height="80" rx="8" fill="#059669" />
  <text x="195" y="465" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Listing Service</text>
  <text x="195" y="485" fill="#d1fae5" font-size="11" text-anchor="middle">GET /api/listing/[id]</text>

  <rect x="340" y="430" width="230" height="80" rx="8" fill="#059669" />
  <text x="455" y="465" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Booking &amp; Calendar</text>
  <text x="455" y="485" fill="#d1fae5" font-size="11" text-anchor="middle">Availability &amp; Pricing Engine</text>

  <rect x="600" y="430" width="230" height="80" rx="8" fill="#059669" />
  <text x="715" y="465" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Search &amp; Map Service</text>
  <text x="715" y="485" fill="#d1fae5" font-size="11" text-anchor="middle">Geo-spatial indexing</text>

  <rect x="860" y="430" width="260" height="80" rx="8" fill="#059669" />
  <text x="990" y="465" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Reviews &amp; Ratings</text>
  <text x="990" y="485" fill="#d1fae5" font-size="11" text-anchor="middle">Aggregation Pipeline</text>

  <!-- Layer 4: Storage & Database Layer -->
  <rect x="40" y="570" width="1120" height="180" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,6" />
  <text x="60" y="595" fill="#8b5cf6" font-size="14" font-weight="bold">4. DATA STORAGE &amp; CACHING LAYER</text>

  <rect x="80" y="620" width="240" height="100" rx="8" fill="#6d28d9" />
  <text x="200" y="655" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Neon PostgreSQL (Primary)</text>
  <text x="200" y="675" fill="#ddd6fe" font-size="11" text-anchor="middle">Prisma ORM · Transactional DB</text>
  <text x="200" y="695" fill="#ddd6fe" font-size="11" text-anchor="middle">Listings, Hosts, Reviews, Amenities</text>

  <rect x="350" y="620" width="240" height="100" rx="8" fill="#6d28d9" />
  <text x="470" y="655" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Read Replicas (Neon)</text>
  <text x="470" y="675" fill="#ddd6fe" font-size="11" text-anchor="middle">Auto-scaling read-only DBs</text>

  <rect x="620" y="620" width="240" height="100" rx="8" fill="#7c3aed" />
  <text x="740" y="655" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Redis Cache Cluster</text>
  <text x="740" y="675" fill="#ddd6fe" font-size="11" text-anchor="middle">In-memory caching for listings</text>
  <text x="740" y="695" fill="#ddd6fe" font-size="11" text-anchor="middle">Session &amp; Rate-limit store</text>

  <rect x="890" y="620" width="240" height="100" rx="8" fill="#7c3aed" />
  <text x="1010" y="655" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Elasticsearch / Algolia</text>
  <text x="1010" y="675" fill="#ddd6fe" font-size="11" text-anchor="middle">Geo-bounding box search</text>
</svg>
